plugins {
    id 'com.android.application'
}

android {
    namespace 'com.findeye.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.findeye.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-ai'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
