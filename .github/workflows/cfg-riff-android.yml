name: CFG Riff Rumble Android APK
on:
  push:
    branches: [cfg-riff-rumble-android-repair, cfg-riff-shopify-promotions]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate promotions server and default OFF configuration
        run: |
          node --test promotions-server/tests/promotions.test.mjs
          python -m json.tool config/promotions.json >/dev/null
      - name: Build real Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare release
        run: cp app/build/outputs/apk/debug/app-debug.apk CFG-Riff-Rumble-Promotions-Beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CFG-Riff-Rumble-Promotions-Beta
          path: CFG-Riff-Rumble-Promotions-Beta.apk
      - name: Publish direct APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create cfg-riff-rumble-android-v2.4-beta CFG-Riff-Rumble-Promotions-Beta.apk --title "CFG Riff Rumble Android v2.4 Beta" --notes "Beta build. Adds fail-closed Shopify promotions placements on Home/Results, remote-off-by-default switch, market selection, CFG themes; NOT live until Shopify is connected." --target ${{ github.sha }}