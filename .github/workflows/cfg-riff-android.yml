name: CFG Riff Rumble Android APK
on:
  push:
    branches: [cfg-riff-rumble-android-repair]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build real Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare release
        run: cp app/build/outputs/apk/debug/app-debug.apk CFG-Riff-Rumble-Fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CFG-Riff-Rumble-Fixed
          path: CFG-Riff-Rumble-Fixed.apk
      - name: Publish direct APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create cfg-riff-rumble-android-v2.2 CFG-Riff-Rumble-Fixed.apk --title "CFG Riff Rumble Android v2.2" --notes "Android native app. CFG green #B9FB55 branding, persistent dark/light modes, 657 questions, online multiplayer." --target ${{ github.sha }}