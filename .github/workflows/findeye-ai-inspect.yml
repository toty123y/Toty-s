name: Build FindEye Real AI APK

on:
  push:
    branches:
      - findeye-real-ai-v2

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download tokenizer assets
        run: |
          mkdir -p findeye-ai/app/src/main/assets
          curl -L --fail --retry 3 -o findeye-ai/app/src/main/assets/vocab.json "https://huggingface.co/google/owlvit-base-patch32/resolve/main/vocab.json"
          curl -L --fail --retry 3 -o findeye-ai/app/src/main/assets/merges.txt "https://huggingface.co/google/owlvit-base-patch32/resolve/main/merges.txt"
          ls -lh findeye-ai/app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: findeye-ai
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp findeye-ai/app/build/outputs/apk/debug/app-debug.apk FindEye-Real-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FindEye-Real-AI
          path: FindEye-Real-AI.apk
          retention-days: 1
