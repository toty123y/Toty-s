name: Build FindEye APK

on:
  push:
    paths:
      - 'findeye/**'
      - '.github/workflows/findeye-build.yml'
  pull_request:
    paths:
      - 'findeye/**'
      - '.github/workflows/findeye-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: findeye
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp findeye/app/build/outputs/apk/debug/app-debug.apk FindEye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindEye-APK
          path: FindEye.apk
          retention-days: 1
